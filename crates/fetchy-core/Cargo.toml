[package]
name = "fetchy-core"
version = "0.2.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
bytes = "1.12.1"
cbc = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
trash = "5.2.9"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
roxmltree = "0.21.1"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }
